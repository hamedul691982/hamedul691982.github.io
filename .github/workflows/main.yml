name: Sync Facebook Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync Facebook posts
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.parse
          import urllib.request

          page_id = os.environ.get("FACEBOOK_PAGE_ID", "")
          token = os.environ.get("FACEBOOK_PAGE_ACCESS_TOKEN", "")

          if not page_id or not token:
              raise SystemExit(
                  "Add FACEBOOK_PAGE_ID and FACEBOOK_PAGE_ACCESS_TOKEN "
                  "to GitHub Actions secrets first."
              )

          params = urllib.parse.urlencode({
              "fields": "id,message,created_time,permalink_url,full_picture",
              "limit": 100,
              "access_token": token
          })
          url = f"https://graph.facebook.com/v23.0/{page_id}/posts?{params}"

          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)

          if "error" in data:
              raise SystemExit(json.dumps(data["error"]))

          os.makedirs("data", exist_ok=True)
          with open("data/posts.json", "w", encoding="utf-8") as file:
              json.dump(data.get("data", []), file, ensure_ascii=False, indent=2)

          print(f"Saved {len(data.get('data', []))} Facebook posts.")
          PY

      - name: Commit updated posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || git commit -m "Sync Facebook posts"
          git push
